<!doctype html>
<html>
  <head>
    <title>Earthquake Symbol Map - Encoding Test</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@5.20.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.1.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.17.0"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .container {
        display: flex;
        gap: 20px;
      }
      .viz-container {
        flex: 1;
      }
      .info-panel {
        width: 300px;
        border: 1px solid #ccc;
        padding: 15px;
      }
      .info-panel h3 {
        margin-top: 0;
      }
      .warning {
        background: #fff3cd;
        border: 1px solid #ffc107;
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
        color: #856404;
      }
      .info {
        background: #d1ecf1;
        border: 1px solid #17a2b8;
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
        color: #0c5460;
      }
      .log-item {
        font-family: monospace;
        font-size: 12px;
        padding: 5px;
        margin: 5px 0;
        background: #f5f5f5;
      }
    </style>
  </head>
  <body>
    <h1>Earthquake Symbol Map - Encoding Analysis</h1>

    <div class="container">
      <div class="viz-container">
        <div id="vis"></div>
      </div>

      <div class="info-panel">
        <h3>Encoding Details</h3>

        <div class="info">
          <strong>Encodings Used:</strong>
          <ul>
            <li>
              <strong>longitude/latitude:</strong> Position (quantitative)
            </li>
            <li><strong>color:</strong> mag (quantitative) - Magnitude</li>
            <li><strong>size:</strong> dmin (quantitative) - Min Distance</li>
            <li>
              <strong>shape:</strong> locationSource (nominal) - Location Source
            </li>
          </ul>
        </div>

        <h3>Validation Messages</h3>
        <div id="messages"></div>

        <h3>Data Info</h3>
        <div id="data-info"></div>
      </div>
    </div>

    <script type="text/javascript">
      // Capture console messages
      const originalWarn = console.warn;
      const originalError = console.error;
      const originalLog = console.log;
      const messages = [];

      console.warn = function (...args) {
        messages.push({ type: "warning", message: args.join(" ") });
        originalWarn.apply(console, args);
      };

      console.error = function (...args) {
        messages.push({ type: "error", message: args.join(" ") });
        originalError.apply(console, args);
      };

      console.log = function (...args) {
        if (
          args[0] &&
          typeof args[0] === "string" &&
          (args[0].includes("warning") ||
            args[0].includes("error") ||
            args[0].includes("encoding"))
        ) {
          messages.push({ type: "log", message: args.join(" ") });
        }
        originalLog.apply(console, args);
      };

      // The modified spec with new encodings
      const spec = {
        $schema: "https://vega.github.io/schema/vega-lite/v5.json",
        width: 800,
        height: 450,
        title:
          "Earthquakes of magnitude 4 or large between 4 Oct 2020 and 10 Oct 2020",
        projection: { type: "equalEarth" },
        layer: [
          {
            data: {
              url: "https://raw.githubusercontent.com/FIT3179/Vega-Lite/main/2_symbol_map/js/ne_110m_admin_0_countries.topojson",
              format: {
                type: "topojson",
                feature: "ne_110m_admin_0_countries",
              },
            },
            mark: { type: "geoshape", fill: "lightgray", stroke: "white" },
          },
          {
            data: {
              url: "https://raw.githubusercontent.com/FIT3179/Vega-Lite/main/2_symbol_map/data/earthquake.csv",
            },
            mark: { type: "point", tooltip: { content: "data" } },
            encoding: {
              longitude: { field: "longitude", type: "quantitative" },
              latitude: { field: "latitude", type: "quantitative" },
              size: {
                field: "dmin",
                type: "quantitative",
                title: "Minimum Distance (degrees)",
              },
              color: {
                field: "mag",
                type: "quantitative",
                title: "Magnitude (Richter scale)",
                scale: { scheme: "reds" },
              },
              shape: {
                field: "locationSource",
                type: "nominal",
                title: "Location Source",
              },
            },
          },
        ],
      };

      // Load the visualization
      vegaEmbed("#vis", spec)
        .then(function (result) {
          // Get the data from the view
          const data = result.view.data(
            "data-ee4b0d47-5e8c-41ad-8b53-1e0f06b0d169",
          );
          if (data && data.length > 0) {
            const uniqueLocationSources = new Set(
              data.map((d) => d.locationSource),
            );
            const dminValues = data
              .map((d) => d.dmin)
              .filter((v) => v !== undefined && v !== null);
            const magValues = data.map((d) => d.mag);

            document.getElementById("data-info").innerHTML = `
      <strong>Data Statistics:</strong>
      <div class="log-item">Total earthquakes: ${data.length}</div>
      <div class="log-item">Unique location sources: ${uniqueLocationSources.size}</div>
      <div class="log-item">Location sources: ${Array.from(uniqueLocationSources).join(", ")}</div>
      <div class="log-item">dmin range: ${Math.min(...dminValues).toFixed(3)} - ${Math.max(...dminValues).toFixed(3)}</div>
      <div class="log-item">mag range: ${Math.min(...magValues).toFixed(2)} - ${Math.max(...magValues).toFixed(2)}</div>
    `;
          }

          // Check for warnings in the compiled spec
          console.log("Visualization compiled successfully");
        })
        .catch(function (error) {
          console.error("Error loading visualization:", error);
          messages.push({ type: "error", message: "Error: " + error.message });
        });

      // Display messages after a short delay
      setTimeout(function () {
        const messagesDiv = document.getElementById("messages");

        if (messages.length === 0) {
          messagesDiv.innerHTML =
            '<div class="info">No specific warnings or errors captured. Shape encoding with multiple location sources may have implicit constraints.</div>';
        } else {
          messagesDiv.innerHTML = messages
            .map((msg) => {
              const className =
                msg.type === "warning"
                  ? "warning"
                  : msg.type === "error"
                    ? "warning"
                    : "info";
              return `<div class="${className}"><strong>${msg.type.toUpperCase()}:</strong><br>${escapeHtml(msg.message)}</div>`;
            })
            .join("");
        }

        // Add explanation about shape encoding
        const explanation = `
    <div class="info">
      <strong>Shape Encoding Notes:</strong><br>
      The shape channel encodes categorical data (locationSource). 
      Vega-Lite supports a limited set of shapes (circle, square, cross, diamond, triangle-up, etc.).
      <br><br>
      <strong>Possible Issue:</strong> If there are more unique values in locationSource than available shapes, 
      Vega-Lite will recycle shapes, which may cause visual ambiguity.
      <br><br>
      <strong>Why it might not be ideal:</strong> The shape channel is less effective for distinguishing many categories 
      compared to color or position. It's better suited for 2-3 categories.
    </div>
  `;

        messagesDiv.innerHTML += explanation;
      }, 2000);

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }
    </script>
  </body>
</html>
